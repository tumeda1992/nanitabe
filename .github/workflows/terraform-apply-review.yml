name: Terraform Apply (review)

# apply の全文は public な log に出さず、state 用 S3 へ保存する。
# job は Environment review を指定する。apply role の信頼条件が environment:review に固定されている。
on:
  push:
    branches: [main]
    paths:
      - "infrastructure/terraform/envs/review/**"
      - "backend/terraform/**"
      - ".terraform-version"
      - ".github/workflows/terraform-apply-review.yml"
      - ".github/actions/terraform-run/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# 実行中の apply は取り消さない。
concurrency:
  group: terraform-apply-review
  cancel-in-progress: false

env:
  TF_VAR_bucket_name: ${{ secrets.TERRAFROM_STATE_S3_BUCKET }}
  TF_VAR_dynamodb_table_name: ${{ secrets.TERRAFROM_STATE_DYNAMODB_TABLE }}
  TF_VAR_codebuild_artifact_s3_bucket: ${{ secrets.CODEBUILD_ARTICACT_S3_BUCKET }}
  TF_VAR_route53_name: ${{ secrets.ROUTE53_HOSTZONE_NAME }}
  TF_VAR_review_backend_alarm_email: ${{ secrets.REVIEW_BACKEND_ALARM_EMAIL }}

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: review
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/terraform-run
        with:
          working-directory: infrastructure/terraform/envs/review
          role-to-assume: ${{ secrets.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          state-key: review/terraform.tfstate
          mode: ${{ github.event_name == 'workflow_dispatch' && 'apply-guarded' || 'apply' }}
          root-name: review
          state-bucket: ${{ secrets.TERRAFROM_STATE_S3_BUCKET }}
          lock-table: ${{ secrets.TERRAFROM_STATE_DYNAMODB_TABLE }}
