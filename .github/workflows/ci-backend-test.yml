name: CI Backend Test

on:
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      RAILS_ENV: test
      BUNDLE_WITHOUT: "development:production"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect backend changes
        id: changes
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          BASE_SHA=$(git merge-base HEAD origin/${{ github.base_ref }})

          CHANGED_FILES="$(git diff --name-only "$BASE_SHA"...HEAD)"

          echo "Changed files:"
          echo "$CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -E '^backend/|^\.github/workflows/ci-backend-test\.yml$' > /dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No backend changes, skip tests
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "No backend changes. Skipping backend tests."

      - name: Setup Ruby
        if: steps.changes.outputs.changed == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.2'
          working-directory: backend
          bundler-cache: true

      - name: Prepare test database (SQLite)
        if: steps.changes.outputs.changed == 'true'
        run: bundle exec rails db:prepare

      - name: Run RSpec tests
        if: steps.changes.outputs.changed == 'true'
        run: bundle exec rspec
