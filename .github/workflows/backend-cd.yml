# バックエンド側の簡易的なCDワークフロー
# - jenkinsに設定をめちゃめちゃ書き込ませたくないから、jenkins側ではgit pull だけやらせる
# - 複雑になるなら、github actions側で多くをやるか、CodeBuildとかに移行する
name: backendのCD

on:
  pull_request:
    types: [closed]

jobs:
  call-url:
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Call ci webhook
        shell: bash
        env:
          JENKINS_URL: ${{ secrets.CI_JENKINS_URL }}
          JENKINS_JOB_URL: ${{ secrets.CI_JENKINS_NANITABE_BUILD_JOB_URL }}
          JENKINS_BUILD_TOKEN: ${{ secrets.CI_JENKINS_NANITABE_BUILD_TOKEN }}
          # 必要なら GitHub Variables にしてもOK
          JENKINS_DEBUG: "false"
        run: |
          set -euo pipefail

          COOKIE_JAR="$(mktemp)"

          # CSRF情報をセッションにセット
          CRUMB_JSON="$(curl -fsS -c "$COOKIE_JAR" "${JENKINS_URL%/}/crumbIssuer/api/json")"
          CRUMB_FIELD="$(jq -r '.crumbRequestField' <<<"$CRUMB_JSON")"
          CRUMB="$(jq -r '.crumb' <<<"$CRUMB_JSON")"

          if [ "${JENKINS_DEBUG}" = "true" ]; then
            echo "crumbRequestField=$CRUMB_FIELD"
          fi

          if [ "${JENKINS_DEBUG}" = "true" ]; then
            curl -i -sS --show-error -X POST \
              -b "$COOKIE_JAR" \
              -H "${CRUMB_FIELD}: ${CRUMB}" \
              "${JENKINS_JOB_URL%/}/build?token=${JENKINS_BUILD_TOKEN}" \
              -o -
          else
            curl -fsS -X POST \
              -b "$COOKIE_JAR" \
              -H "${CRUMB_FIELD}: ${CRUMB}" \
              "${JENKINS_JOB_URL%/}/build?token=${JENKINS_BUILD_TOKEN}"
          fi
