name: backendのCD(レビュー用)

on:
  push:

jobs:
  call-url:
    runs-on: ubuntu-latest

    steps:
      - name: Call ci webhook
        run: |
          set -euo pipefail

          JENKINS_URL="https://jenkins.kibotsu.com"
          JOB_URL="$JENKINS_URL/job/nanitabe%E3%83%90%E3%83%83%E3%82%AF%E3%82%A8%E3%83%B3%E3%83%89%E3%83%93%E3%83%AB%E3%83%89"
          TOKEN="nanitabe_backend_build"

          echo "JOB_URL=${JOB_URL}"
          echo "BUILD_URL=${JOB_URL}/build?token=${TOKEN}"

          COOKIE_JAR="$(mktemp)"

          # jobページが本当に存在するか（匿名GET）
          echo "== GET job page =="
          curl -i -sS "${JOB_URL}/" -o -

          # crumb取得（cookie保存）
          echo "== GET crumb =="
          CRUMB_JSON=$(curl -i -sS -c "$COOKIE_JAR" "$JENKINS_URL/crumbIssuer/api/json" -o -)
          echo "$CRUMB_JSON" | tail -n +1 | head -n 30

          # JSON部分だけ抜く（ヘッダ混ざるので末尾から拾う）
          CRUMB_FIELD=$(echo "$CRUMB_JSON" | tail -n 1 | jq -r '.crumbRequestField')
          CRUMB=$(echo "$CRUMB_JSON" | tail -n 1 | jq -r '.crumb')

          echo "crumbRequestField=$CRUMB_FIELD"

          echo "== POST build =="
          curl -i -sS --show-error -X POST \
          -b "$COOKIE_JAR" \
          -H "${CRUMB_FIELD}: ${CRUMB}" \
          "${JOB_URL}/build?token=${TOKEN}" \
          -o -
