name: backendのCD(レビュー用)

on:
  push:

jobs:
  call-url:
    runs-on: ubuntu-latest

    steps:
      - name: Call ci webhook
        run: |
          set -euo pipefail

          JENKINS_URL="https://jenkins.kibotsu.com"
          JOB_URL="$JENKINS_URL/job/nanitabe%E3%83%90%E3%83%83%E3%82%AF%E3%82%A8%E3%83%B3%E3%83%89%E3%83%93%E3%83%AB%E3%83%89"
          TOKEN="nanitabe_backend_build"

          COOKIE_JAR="$(mktemp)"

          # 1) crumb を取得（このときのセッションCookieを保存する）
          CRUMB_JSON=$(curl -fsS -c "$COOKIE_JAR" "$JENKINS_URL/crumbIssuer/api/json")
          CRUMB_FIELD=$(echo "$CRUMB_JSON" | jq -r '.crumbRequestField')
          CRUMB=$(echo "$CRUMB_JSON" | jq -r '.crumb')

          echo "crumbRequestField=$CRUMB_FIELD"

          # 2) 同じCookieを付けてビルド起動（POST）
          curl -fsS -X POST \
          -b "$COOKIE_JAR" \
          -H "${CRUMB_FIELD}: ${CRUMB}" \
          "${JOB_URL}/build?token=${TOKEN}"
