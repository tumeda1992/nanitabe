version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin ${ECR_REPO_URI}
  build:
    commands:
      - echo Building the Docker image...
      - cd frontend
      - docker build
        --build-arg AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
        --build-arg AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
        --build-arg AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
        --build-arg NEXT_PUBLIC_CLIENT_SIDE_PROD_ORIGIN=${NEXT_PUBLIC_CLIENT_SIDE_PROD_ORIGIN}
        --build-arg DEPLOY_ENV=${DEPLOY_ENV}
        -t ${ECR_REPO_URI}:${IMAGE_TAG} 
        -f buildOnLambda/Dockerfile .
  post_build:
    commands:
      - echo Pushing the Docker image...
      - docker push ${ECR_REPO_URI}:${IMAGE_TAG}
      - echo Updating Lambda function...
      - aws lambda update-function-code --function-name ${LAMBDA_FUNCTION_NAME} --image-uri ${ECR_REPO_URI}:${IMAGE_TAG}
