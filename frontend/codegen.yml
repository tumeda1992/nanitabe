overwrite: true
schema: "http://nanitabe_back:18101/graphql"
config:
  withHOC: false
  withComponent: false
  withHooks: true
generates:
  # codegenのバージョンを上げると以下のエラーが起きる。
  # canonizeResults is deprecated and will be removed in Apollo Client 4.0. Please remove this option.
  src/lib/graphql/generated/graphql.ts:
    documents: "src/features/**/*.ts"
    plugins:
      - "typescript"
      - "typescript-operations"
      # apolloの公式でも非推奨になったらしい
      - "typescript-react-apollo"
  src/lib/graphql/generated/graphql.schema.json:
    plugins:
      - "introspection"
